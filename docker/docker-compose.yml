x-airflow-common-env: &airflow-common-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password}@postgres:5432/airflow_db
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
  PYTHONPATH: /opt/airflow
  SYMBOLS: ${SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT}
  BINANCE_API_BASE: ${BINANCE_API_BASE:-https://api.binance.com}
  KRAKEN_API_BASE: ${KRAKEN_API_BASE:-https://api.kraken.com}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-admin}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
  POSTGRES_DB: ${POSTGRES_DB:-crypto_pipeline}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC: ${KAFKA_TOPIC:-crypto.prices}
  # Pull in the project's own dependencies on top of the base Airflow image.
  _PIP_ADDITIONAL_REQUIREMENTS: "requests psycopg2-binary kafka-python python-dotenv"

services:
  # --- Staging layer: one Postgres instance serves both the staging tables
  # and Airflow's own metadata DB, to avoid running a second database. ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-crypto_pipeline}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/01_create_airflow_db.sql:/docker-entrypoint-initdb.d/01_create_airflow_db.sql:ro
      - ../postgres/schema.sql:/docker-entrypoint-initdb.d/02_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Streaming layer: single-node Kafka in KRaft mode (no Zookeeper). ---
  kafka:
    image: apache/kafka:3.7.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # --- Serving layer. ---
  cassandra:
    image: cassandra:5.0
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: crypto_cluster
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 15s
      timeout: 10s
      retries: 15

  # One-shot job: applies cassandra/schema.cql once Cassandra is healthy, then exits.
  cassandra-init:
    image: cassandra:5.0
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ../cassandra/schema.cql:/schema.cql:ro
    entrypoint: ["cqlsh", "cassandra", "-f", "/schema.cql"]
    restart: "no"

  # --- Orchestration: webserver + scheduler + triggerer in a single process. ---
  airflow:
    image: apache/airflow:2.9.3-python3.11
    depends_on:
      postgres:
        condition: service_healthy
    environment: *airflow-common-env
    ports:
      - "8080:8080"
    volumes:
      - ../dags:/opt/airflow/dags
      - ../src:/opt/airflow/src
      - ../streaming:/opt/airflow/streaming
    command: standalone

  # --- Processing layer: long-running Structured Streaming job. ---
  spark-job:
    image: bitnami/spark:3.5.1
    depends_on:
      - kafka
      - cassandra-init
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-crypto.prices}
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: "9042"
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-crypto_metrics}
    volumes:
      - ../spark_jobs:/opt/spark_jobs
    command: >
      bash -c "pip install --user cassandra-driver==3.29.1 &&
      spark-submit
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
      /opt/spark_jobs/stream_processing.py"

volumes:
  postgres_data:
  cassandra_data:
